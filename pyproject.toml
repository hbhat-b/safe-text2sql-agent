[project]
name = "safe-text2sql-agent"
version = "0.1.0"
description = "Guardrailed LangGraph text-to-SQL agent with FastAPI and WebSocket streaming"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
